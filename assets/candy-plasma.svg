<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">iennn.dev GitHub profile banner</title>
  <desc id="desc">A candy plasma gradient banner for iennn.dev and the GitHub username vnsannn.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10091D"/>
      <stop offset="0.48" stop-color="#25103C"/>
      <stop offset="1" stop-color="#081D2B"/>
    </linearGradient>
    <linearGradient id="plasma" x1="180" y1="40" x2="1430" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5DB1"/>
      <stop offset="0.38" stop-color="#B06CFF"/>
      <stop offset="0.7" stop-color="#5CF6E5"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <radialGradient id="pink" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 80) rotate(30) scale(480 300)">
      <stop stop-color="#FF5DB1" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#FF5DB1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1280 340) rotate(-20) scale(520 330)">
      <stop stop-color="#5CF6E5" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#5CF6E5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur80" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="blur30" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="160" y1="0" x2="1410" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5DB1" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FF5DB1" stop-opacity="0.75"/>
      <stop offset="0.65" stop-color="#5CF6E5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5CF6E5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="420" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="1560" height="380" rx="22" fill="url(#grid)"/>

  <ellipse cx="280" cy="55" rx="330" ry="210" fill="url(#pink)" filter="url(#blur30)"/>
  <ellipse cx="1310" cy="375" rx="390" ry="230" fill="url(#cyan)" filter="url(#blur30)"/>
  <circle cx="840" cy="184" r="130" fill="#9D4EDD" fill-opacity="0.18" filter="url(#blur80)"/>

  <path d="M-70 316C166 94 322 390 572 189C814 -7 954 286 1178 128C1342 12 1440 95 1670 -45" stroke="url(#line)" stroke-width="2" stroke-linecap="round"/>
  <path d="M-50 350C196 125 326 414 596 218C820 55 982 311 1204 160C1392 32 1451 142 1660 -20" stroke="url(#line)" stroke-opacity="0.28" stroke-width="7" stroke-linecap="round" filter="url(#blur30)"/>

  <g fill="#FFFFFF">
    <circle cx="119" cy="100" r="3" fill-opacity="0.85"/>
    <circle cx="1480" cy="90" r="3" fill-opacity="0.75"/>
    <circle cx="1384" cy="250" r="2" fill-opacity="0.65"/>
    <circle cx="1050" cy="90" r="2" fill-opacity="0.6"/>
    <circle cx="474" cy="330" r="2" fill-opacity="0.7"/>
  </g>


  <g transform="translate(1170 92) rotate(12)">
    <rect width="190" height="190" rx="46" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <circle cx="95" cy="95" r="54" stroke="url(#plasma)" stroke-width="5" stroke-dasharray="5 12"/>
    <circle cx="95" cy="95" r="25" fill="url(#plasma)" fill-opacity="0.75"/>
    <circle cx="95" cy="95" r="10" fill="#FFFFFF" fill-opacity="0.88"/>
  </g>
</svg>
